language: generic
before_install:
  - sudo apt-get install python-pygments
install:
  - source ./texlive/texlive_install.sh

cache:
  directories:
    - /tmp/texlive
    - $HOME/.texlive
# Change working directory so including files will work
before_script: cd $TRAVIS_BUILD_DIR/cv
script:
  - pdflatex --shell-escape ./cv.tex
deploy:
  provider: releases
  api_key:
    secure: ${GITHUB_TOKEN}
  file:
    - ./cv.pdf
  skip_cleanup: true
  on:
    tags: true
    branch: *
notifications:
  email: false
